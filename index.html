<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Under construction</title>
    <noscript>
      <style>
        main {
          visibility: visible !important;
        }
      </style>
    </noscript>
  </head>
  <body class="bg-neutral-950 font-sans text-white antialiased">
    <main
      class="invisible flex min-h-dvh items-center justify-center p-6 in-data-ready:visible md:p-10"
    >
      <div
        class="mx-auto flex w-full max-w-lg flex-col items-center gap-6 text-center"
      >
        <div
          class="bg-accent-500/10 shadow-accent-500/20 ring-accent-500/20 flex h-20 w-20 items-center justify-center rounded-full shadow-[0_0_30px_-10px] ring-1"
          aria-hidden="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-accent-500 h-10 w-10 in-data-[mode=maintenance]:hidden"
          >
            <rect x="2" y="6" width="20" height="8" rx="1" />
            <path d="M17 14v7" />
            <path d="M7 14v7" />
            <path d="M17 3v3" />
            <path d="M7 3v3" />
            <path d="M10 14 2.3 6.3" />
            <path d="m14 6 7.7 7.7" />
            <path d="m8 6 8 8" />
          </svg>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-accent-500 hidden h-10 w-10 in-data-[mode=maintenance]:block"
          >
            <path
              d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            />
          </svg>
        </div>

        <span
          id="status"
          class="bg-accent-500/10 text-accent-600 ring-accent-500 rounded-md px-1.5 py-0.5 text-[10px] font-medium tracking-wider uppercase ring"
        >
          In development
        </span>

        <div class="space-y-2">
          <h1
            id="title"
            class="text-2xl font-semibold text-balance sm:text-3xl"
          >
            Under construction
          </h1>
          <p
            id="description"
            class="text-sm text-pretty text-neutral-400 sm:text-base"
          >
            This project is still being built and will be available soon.
          </p>
        </div>

        <a
          href="https://adityapunmiya.com"
          class="bg-accent-500 hover:bg-accent-400 focus-visible:outline-accent-500 inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium text-neutral-950 focus-visible:outline-2 focus-visible:outline-offset-2 in-data-ready:transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-4 w-4"
            aria-hidden="true"
          >
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
          Back to adityapunmiya.com
        </a>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
